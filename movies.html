<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Information Portal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/movies.css" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
  </head>

  <body>
    <header>
      <div class="logo">
        <img height="60px" src="img/logo.png" alt="logo" />
      </div>

      <form action="movies.html" class="search">
        <input
          name="search-movie-title"
          id="search-movie-title"
          type="text"
          placeholder="Search movie"
        />
        <input id="search-movie-submit" type="submit" value="go" />

        <select id="searchSelect" name="search-movie-genre">
          <option selected disabled>Genre</option>
        </select>
        <select id="sortSelect" name="sort-movie">
          <option value="" selected disabled>Sort by</option>
          <option value="title-asc">Title (A&hyphen;Z)</option>
          <option value="title-desc">Title (Z&hyphen;A)</option>
          <option value="year-asc">Year (Oldest First)</option>
          <option value="year-desc">Year (Newest First)</option>
          <option value="rating-desc">Rating (Highest First)</option>
          <option value="rating-asc">Rating (Lowest First)</option>
        </select>
      </form>

      <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="favorites.html">Favorites</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <div class="movie-cards">
        <span class="loading">Loading...</span>
      </div>
    </main>

    <footer>
      <span>&copy; 2026 Movie Portal</span>
      <span>Links</span>
      <span>Contact Info</span>
    </footer>
    <script src="js/helper.js" type="module"></script>
    <script src="js/movies.js" type="module"></script>
  </body>
</html>
